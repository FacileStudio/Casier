<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script type="module" src="https://cdn.jsdelivr.net/npm/iconify-icon@2.2.0/dist/iconify-icon.min.js"></script>
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('casier.theme');
					document.documentElement.classList.toggle('dark', stored === 'dark');
					document.documentElement.classList.toggle('light', stored === 'light');
				} catch (e) {}
			})();
		</script>
		<script>
			(function () {
				if (location.hostname !== 'casier.facile.studio') return;
				var s = document.createElement('script');
				s.async = true;
				s.src = 'https://vision.facile.studio/s.js';
				s.setAttribute('data-mask', '');
				document.head.appendChild(s);
			})();
		</script>

		<meta name="color-scheme" content="light dark" />

		%sveltekit.head%
		<title>Casier · A secrets vault for your team</title>
		<meta name="description" content="AES-256-GCM encryption, secrets injected into your shell, a version history and an audit log." />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Facile" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:url" content="https://casier.facile.studio/" />
		<meta property="og:title" content="Casier · A secrets vault for your team" />
		<meta property="og:description" content="AES-256-GCM encryption, secrets injected into your shell, a version history and an audit log." />
		<meta property="og:image" content="https://casier.facile.studio/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Casier: A secrets vault for your team" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Casier · A secrets vault for your team" />
		<meta name="twitter:description" content="AES-256-GCM encryption, secrets injected into your shell, a version history and an audit log." />
		<meta name="twitter:image" content="https://casier.facile.studio/og-image.png" />
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
