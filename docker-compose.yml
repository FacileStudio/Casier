services:
  casier-db:
    container_name: casier-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casier}
      POSTGRES_USER: ${POSTGRES_USER:-casier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casier-internal-db}
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casier}"]
      interval: 5s
      timeout: 5s
      retries: 10

  casier-api:
    container_name: casier-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    expose:
      - "4000"
    networks:
      - default
      - dokploy-network
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.casier-api-web.rule: "Host(`casier.facile.studio`) && PathPrefix(`/api`)"
      traefik.http.routers.casier-api-web.entrypoints: web
      traefik.http.routers.casier-api-web.middlewares: redirect-to-https@file
      traefik.http.routers.casier-api-web.service: casier-api-svc
      traefik.http.routers.casier-api-secure.rule: "Host(`casier.facile.studio`) && PathPrefix(`/api`)"
      traefik.http.routers.casier-api-secure.entrypoints: websecure
      traefik.http.routers.casier-api-secure.tls.certresolver: letsencrypt
      traefik.http.routers.casier-api-secure.middlewares: casier-strip-api
      traefik.http.routers.casier-api-secure.service: casier-api-svc
      traefik.http.middlewares.casier-strip-api.stripprefix.prefixes: /api
      traefik.http.services.casier-api-svc.loadbalancer.server.port: "4000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-casier}:${POSTGRES_PASSWORD:-casier-internal-db}@casier-db:5432/${POSTGRES_DB:-casier}?sslmode=disable
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://casier.facile.studio}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
      SSO_ONLY: ${SSO_ONLY:-false}
    depends_on:
      casier-db:
        condition: service_healthy

  casier-client:
    container_name: casier-client
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        VITE_API_BASE_URL: https://casier.facile.studio/api
    expose:
      - "80"
    networks:
      - default
      - dokploy-network
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.casier-client-web.rule: "Host(`casier.facile.studio`)"
      traefik.http.routers.casier-client-web.entrypoints: web
      traefik.http.routers.casier-client-web.middlewares: redirect-to-https@file
      traefik.http.routers.casier-client-web.service: casier-client-svc
      traefik.http.routers.casier-client-secure.rule: "Host(`casier.facile.studio`)"
      traefik.http.routers.casier-client-secure.entrypoints: websecure
      traefik.http.routers.casier-client-secure.tls.certresolver: letsencrypt
      traefik.http.routers.casier-client-secure.service: casier-client-svc
      traefik.http.services.casier-client-svc.loadbalancer.server.port: "80"
    depends_on:
      - casier-api

networks:
  dokploy-network:
    external: true

volumes:
  db_data:
    name: casier_db_data
